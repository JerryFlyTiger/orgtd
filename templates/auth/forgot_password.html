{% extends "base.html" %}
{% block title %}忘記密碼 — orgtd{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>用救援碼重設密碼</h1>

  <p class="field-hint">
    註冊時給過你一批救援碼。輸入其中任一組（大小寫、連字號都不影響），
    就可以直接設定新密碼。每組只能用一次。
  </p>

  <form method="post" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" required autofocus
           autocomplete="username">

    <label for="recovery_code">救援碼</label>
    <input id="recovery_code" name="recovery_code" type="text" required
           placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off"
           spellcheck="false">

    <label for="new_password">新密碼</label>
    <input id="new_password" name="new_password" type="password" required
           minlength="{{ min_password_length }}" autocomplete="new-password" data-password-meter="{{ min_password_length }}">

    <label for="new_password_confirm">再輸入一次新密碼</label>
    <input id="new_password_confirm" name="new_password_confirm" type="password"
           required minlength="{{ min_password_length }}" autocomplete="new-password"
           data-password-match="new_password">

    <button type="submit" class="primary-button">重設密碼</button>
  </form>

  <p class="auth-alt">
    想起來了？<a href="{{ url_for('auth.login') }}">回去登入</a>
  </p>

  <p class="field-hint">
    救援碼也不見了？如果這台機器是你自己的，可以在終端機重新產生：<br>
    <code>.venv/bin/python manage.py recovery-codes 你的email</code>
  </p>
</div>
{% endblock %}
